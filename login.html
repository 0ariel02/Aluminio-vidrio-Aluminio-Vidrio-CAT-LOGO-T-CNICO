<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Sistema de Cotización - Aluminio & Vidrio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e2a3a 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
            padding: 40px 32px;
            position: relative;
            overflow: hidden;
        }

        .logo-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-header h1 {
            font-size: 1.8rem;
            color: #1e293b;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-header h1 span {
            color: #f97316;
        }

        .logo-header p {
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 28px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #64748b;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #0f172a;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-panel {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .form-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            background: #f8fafc;
        }

        .input-group input:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1);
            background: #ffffff;
        }

        .input-group input.error {
            border-color: #ef4444;
            background: #fef2f2;
        }

        .error-msg {
            font-size: 0.75rem;
            color: #ef4444;
            margin-top: 4px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .message-box {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }

        .message-box.success {
            display: block;
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .message-box.error {
            display: block;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: #94a3b8;
            line-height: 1.5;
        }

        .footer-note strong {
            color: #64748b;
        }

        /* Simula el logo técnico */
        .tech-icon {
            display: inline-block;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-header">
            <div class="tech-icon">⚙️</div>
            <h1>Aluminio <span>&</span> Vidrio</h1>
            <p>Sistema de Cotización Técnica</p>
        </div>

        <!-- Pestañas -->
        <div class="tabs">
            <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Iniciar Sesión</button>
            <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Registrarse</button>
        </div>

        <!-- Mensajes globales -->
        <div id="globalMessage" class="message-box"></div>

        <!-- Formulario Login -->
        <div id="panelLogin" class="form-panel active">
            <form id="formLogin" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="loginEmail">Correo Electrónico</label>
                    <input type="email" id="loginEmail" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="input-group">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Acceder al Cotizador</button>
            </form>
        </div>

        <!-- Formulario Registro -->
        <div id="panelRegister" class="form-panel">
            <form id="formRegister" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label for="regName">Nombre Completo</label>
                    <input type="text" id="regName" placeholder="Juan Pérez" required>
                </div>
                <div class="input-group">
                    <label for="regEmail">Correo Electrónico</label>
                    <input type="email" id="regEmail" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="input-group">
                    <label for="regPassword">Contraseña (mín. 6 caracteres)</label>
                    <input type="password" id="regPassword" placeholder="••••••••" minlength="6" required>
                </div>
                <div class="input-group">
                    <label for="regConfirm">Confirmar Contraseña</label>
                    <input type="password" id="regConfirm" placeholder="••••••••" required>
                    <span class="error-msg" id="confirmError">Las contraseñas no coinciden</span>
                </div>
                <button type="submit" class="btn-submit">Crear Cuenta</button>
            </form>
        </div>

        <div class="footer-note">
            <strong>Demo segura</strong> · Los datos se guardan localmente en tu navegador.<br>
            Al continuar aceptas los términos del sistema de cotización.
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN - URL DEL COTIZADOR
        // ============================================
        const COTIZADOR_URL = "https://0ariel02.github.io/Aluminio-vidrio-Aluminio-Vidrio-CAT-LOGO-T-CNICO/";

        // ============================================
        // UTILIDADES
        // ============================================
        function showMessage(text, type = 'error') {
            const box = document.getElementById('globalMessage');
            box.textContent = text;
            box.className = `message-box ${type}`;
            setTimeout(() => {
                box.className = 'message-box';
            }, 4000);
        }

        function switchTab(tab) {
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const panelLogin = document.getElementById('panelLogin');
            const panelRegister = document.getElementById('panelRegister');

            if (tab === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                panelLogin.classList.add('active');
                panelRegister.classList.remove('active');
            } else {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                panelRegister.classList.add('active');
                panelLogin.classList.remove('active');
            }
            // Limpiar mensajes
            document.getElementById('globalMessage').className = 'message-box';
        }

        // ============================================
        // GESTIÓN DE USUARIOS (localStorage)
        // ============================================
        function getUsers() {
            const data = localStorage.getItem('cotizador_users');
            return data ? JSON.parse(data) : [];
        }

        function saveUsers(users) {
            localStorage.setItem('cotizador_users', JSON.stringify(users));
        }

        // ============================================
        // REGISTRO
        // ============================================
        function handleRegister(e) {
            e.preventDefault();
            
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            const confirmError = document.getElementById('confirmError');

            // Validar confirmación
            if (password !== confirm) {
                confirmError.classList.add('show');
                return;
            }
            confirmError.classList.remove('show');

            // Validar longitud
            if (password.length < 6) {
                showMessage('La contraseña debe tener al menos 6 caracteres.', 'error');
                return;
            }

            // Verificar si el usuario ya existe
            const users = getUsers();
            if (users.find(u => u.email === email)) {
                showMessage('Este correo ya está registrado. Inicia sesión.', 'error');
                return;
            }

            // Guardar usuario (en un sistema real, aquí se hashearía la contraseña)
            users.push({ name, email, password });
            saveUsers(users);

            showMessage('¡Registro exitoso! Ahora puedes iniciar sesión.', 'success');
            
            // Limpiar formulario y cambiar a login
            document.getElementById('formRegister').reset();
            setTimeout(() => {
                switchTab('login');
                document.getElementById('loginEmail').value = email;
            }, 1500);
        }

        // ============================================
        // LOGIN
        // ============================================
        function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;

            const users = getUsers();
            const user = users.find(u => u.email === email && u.password === password);

            if (!user) {
                showMessage('Credenciales incorrectas. Verifica tu correo y contraseña.', 'error');
                return;
            }

            // Guardar sesión activa
            localStorage.setItem('cotizador_session', JSON.stringify({ 
                name: user.name, 
                email: user.email,
                loginTime: new Date().toISOString()
            }));

            showMessage(`Bienvenido, ${user.name}. Redirigiendo al cotizador...`, 'success');

            // Redirigir después de un breve delay
            setTimeout(() => {
                window.location.href = COTIZADOR_URL;
            }, 1200);
        }

        // ============================================
        // VERIFICAR SESIÓN ACTIVA AL CARGAR
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            const session = localStorage.getItem('cotizador_session');
            if (session) {
                try {
                    const user = JSON.parse(session);
                    showMessage(`Sesión activa: ${user.name}. Redirigiendo...`, 'success');
                    setTimeout(() => {
                        window.location.href = COTIZADOR_URL;
                    }, 1500);
                } catch (e) {
                    localStorage.removeItem('cotizador_session');
                }
            }
        });
    </script>
</body>
</html>
